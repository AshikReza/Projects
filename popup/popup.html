<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div id="app-container">
      <!-- View 1: Settings for API Key (UPDATED) -->
      <div id="settings-view" class="view hidden">
        <h2>Gemini API Settings</h2>
        <p>Please enter your API key from Google AI Studio to continue.</p>

        <input
          type="password"
          id="apiKeyInput"
          placeholder="Paste your Gemini API key here"
        />
        <button id="saveApiKeyBtn">Save and Continue</button>
        <div id="statusMessage"></div>

        <!-- ========================================================= -->
        <!-- === NEW: "How to get API Key" Link ====================== -->
        <!-- ========================================================= -->
        <p class="api-key-link">
          <a
            href="https://aistudio.google.com/app/apikey"
            target="_blank"
            rel="noopener noreferrer"
          >
            Get your Gemini API Key here
          </a>
        </p>
        <!-- ========================================================= -->
      </div>

      <!-- View 2: Main Chat Interface (Unchanged) -->
      <div id="chat-view" class="view hidden">
        <div id="chatbox">
          <!-- Messages will be injected here by JS -->
        </div>
        <div class="input-area">
          <input
            type="text"
            id="userInput"
            placeholder="Ask for a hint..."
            autocomplete="off"
          />
          <button id="sendBtn">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </button>
        </div>
      </div>
    </div>
    <!-- Load the LOCAL library FIRST -->
    <script src="../lib/marked.min.js"></script>
    <!-- Then load your own script -->
    <script src="popup.js"></script>
  </body>
</html>
